<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chocolate Oracle | Draw your sign</title>
    <meta name="description" content="Draw your zodiac card and get today's reading from the Chocolate Oracle.">
    <link rel="stylesheet" href="oracle-intro.css">
</head>
<body>

    <a class="skip-shop" href="shop.html">Skip to the shop <span aria-hidden="true">→</span></a>

    <main class="oracle-intro" id="top">
        <div class="intro-backdrop" aria-hidden="true"></div>

        <a class="intro-logo" href="shop.html" aria-label="The Chocolate Oracle home">
            <img src="https://scontent.fbtr1-1.fna.fbcdn.net/v/t39.30808-6/594072596_122097712575153212_9166603788342999100_n.jpg?stp=dst-jpg_tt6&amp;cstp=mx500x500&amp;ctp=s500x500&amp;_nc_cat=108&amp;ccb=1-7&amp;_nc_sid=6ee11a&amp;_nc_ohc=r9WMjKjKbZIQ7kNvwG5Yayb&amp;_nc_oc=Adr1AbtajCmg60G0U6X-JL86kqpSKoylIPFxCXI_S026IdfykBBBpPwS6JotdLHTeus&amp;_nc_zt=23&amp;_nc_ht=scontent.fbtr1-1.fna&amp;_nc_gid=QRbJIeFo7KZ7VgWL2P33UQ&amp;_nc_ss=7b2a8&amp;oh=00_AQHlGFoj-AohFdkRQfYXMRDlt6p4kGwg3x56mPkNC_NFeQ&amp;oe=6A7360A0" alt="The Chocolate Oracle logo">
            <span>The Chocolate<br><em>Oracle</em></span>
        </a>

        <div class="intro-lead">
            <p class="eyebrow">The oracle knows</p>
            <h1>Draw your <em>sign.</em></h1>
            <p class="intro-copy">Twelve cards, one for each sign. Find yours and the reading is on us.</p>
        </div>

        <div class="deck-wrap">
            <div class="card-fan" id="cardFan"><!-- cards injected by JS --></div>
        </div>
    </main>

    <div class="reading-scrim" id="readingScrim">
        <section class="reading-panel" id="readingPanel" role="dialog" aria-modal="true" aria-labelledby="readingSign">
            <button class="reading-close" id="readingClose" aria-label="Close reading">×</button>
            <span class="eyebrow" id="readingArcana">Arcana I</span>
            <span class="reading-glyph" id="readingGlyph" aria-hidden="true">I</span>
            <h2 id="readingSign">Aries</h2>
            <p class="reading-dates" id="readingDates">Mar 21 – Apr 19</p>
            <p class="reading-text" id="readingText"></p>
            <div class="reading-pairing">
                <span class="eyebrow">Today's pairing</span>
                <p id="readingPairing"></p>
            </div>
            <div class="reading-actions">
                <a href="shop.html#menu" class="btn-primary">Order your pairing <span aria-hidden="true">→</span></a>
                <button class="btn-secondary" id="readingAgain" type="button">Draw again</button>
            </div>
        </section>
    </div>

    <script src="oracle-intro.js"></script>
</body>
</html>
